---
steps:
  - name: ":hammer_and_pick: Build dev image"
    key: "build-pipeline-image"
    agents:
      queue: "rea-artifacts:build"
    plugins:
      - ssh://git@git.realestate.com.au/buildkite-plugin/ecr-release-buildkite-plugin#v1.6.4:
          namespace: "data-platform"
          repository: "hackday-45-talk-to-your-data-dev"
          tags: "$BUILDKITE_BUILD_NUMBER"
          dockerfile-path: "Dockerfile.ui"
          artifacts-path: "pipeline-release.txt"
          lifecycle_policy:
            retain_tagged_image_count: 5

  - name: ":lint-roller: Lint python"
    depends_on: "build-pipeline-image"
    command: "auto/lint"
    plugins:
      - artifacts#v1.9.4:
          download: "artifacts/pipeline-release.txt"

  - name: ":pytest: Test python"
    depends_on: "build-pipeline-image"
    command: "auto/test"
    plugins:
      - artifacts#v1.9.4:
          download: "artifacts/pipeline-release.txt"

  - name: ":pyright: Type-check python"
    depends_on: "build-pipeline-image"
    command: "auto/type-check"
    plugins:
      - artifacts#v1.9.4:
          download: "artifacts/pipeline-release.txt"

  - name: ":hadolint: Lint Dockerfiles"
    command: "auto/lint-docker"

  - name: ":bash: Lint shell scripts"
    command: "auto/lint-shell"

